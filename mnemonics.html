<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>口訣複習區 — 牙醫國考</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f8f7f0">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="themes.css">
<script src="version.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root {
  --bg: #f8f7f0;
  --bg-card: #ffffff;
  --text: #2d2a22;
  --text-sub: #7a7060;
  --border: #e4e0d4;
  --shadow: 0 2px 10px rgba(0,0,0,.07);
  --ya3: #0e7490;
  --ya4: #7c3aed;
  --ya5: #3730a3;
  --ya6: #166534;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
  /* v313:沒主題時用 --bg(預設米),有主題時用主題的 --purple-light,跟筆記區一致 */
  background: var(--purple-light, var(--bg));
  color: var(--text);
  min-height: 100vh;
  padding: 1rem;
  max-width: 1100px;
  margin: 0 auto;
}
.topbar { display: flex; align-items: center; gap: .7rem; padding: .8rem 1rem; background: white; border-radius: 12px; box-shadow: var(--shadow); margin-bottom: .55rem; flex-wrap: wrap; }
.nav-row { display: flex; gap: .4rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
/* v334:正在瀏覽 namespace + 搜尋 + 使用者標籤都並到 nav-row */
.nav-row .ns-inline { font-size: .92rem; font-weight: 800; display: inline-flex; align-items: center; gap: .3rem; padding: .35rem .65rem; background: white; border: 1.5px solid var(--border); border-radius: 999px; box-shadow: var(--shadow); }
.nav-row .ns-inline .user-select { background: #f3f4f6; border: 1.5px solid var(--border); color: var(--text); padding: .15rem .55rem; border-radius: 6px; font-weight: 800; font-size: .88rem; cursor: pointer; font-family: inherit; }
.nav-row .ns-inline .user-select:hover { background: #e5e7eb; }
/* 搜尋改放下一排 */
.search-row { margin-bottom: 1rem; }
.search-row .ch-search-top { width: 100%; padding: .55rem .85rem; border: 1.5px solid var(--border); border-radius: 10px; font-family: inherit; font-size: .9rem; outline: none; background: white; box-shadow: var(--shadow); box-sizing: border-box; }
.search-row .ch-search-top:focus { border-color: var(--ya5); }
.nav-row .user-tag { font-size: .78rem; color: var(--text-sub); background: #f3f4f6; padding: .35rem .7rem; border-radius: 999px; font-weight: 600; }
.nav-row .user-tag.readonly { background: #fef3c7; color: #92400e; }
@media (max-width: 720px) {
  .nav-row .ns-inline { flex-basis: 100%; justify-content: center; font-size: .85rem; padding: .3rem .55rem; }
  .nav-row { gap: .3rem; margin-bottom: .65rem; }
  .nav-link.nav-pill { font-size: .78rem; padding: .25rem .55rem; }
  .search-row { margin-bottom: .65rem; }
  .search-row .ch-search-top { padding: .4rem .65rem; font-size: .82rem; }
  #load-status { font-size: .68rem; padding-bottom: .2rem; }
  .subject-tabs button { padding: .45rem .2rem; font-size: .85rem; min-width: 0; }
}
.nav-link { padding: .42rem 1rem; border-radius: 999px; font-size: .85rem; font-weight: 700; text-decoration: none; cursor: pointer; transition: all .12s; background: #f3f4f6; color: var(--text); border: 1.5px solid var(--border); }
.nav-link:hover { background: #e5e7eb; transform: translateY(-1px); }
.nav-link.nav-notebook { background: #3730a3; color: white; border-color: #3730a3; }
.nav-link.nav-notebook:hover { background: #312e81; }
.topbar h1 { font-size: 1.15rem; font-weight: 800; flex: 1; }
.topbar .back { background: #f3f4f6; border: 1px solid var(--border); color: var(--text-sub); padding: .45rem .85rem; border-radius: 8px; font-weight: 700; cursor: pointer; text-decoration: none; font-size: .85rem; }
.topbar-add { background: #16a34a; color: white; border: none; padding: .5rem 1rem; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: .9rem; box-shadow: 0 2px 6px rgba(22,163,74,.3); }
.topbar-add:hover { background: #15803d; }
.topbar-add:disabled, .topbar-add.hidden { display: none; }
.user-tag { font-size: .78rem; color: var(--text-sub); background: #f3f4f6; padding: .35rem .7rem; border-radius: 999px; font-weight: 600; }
.user-tag.readonly { background: #fef3c7; color: #92400e; }
.topbar .ns-title { font-size: 1rem; font-weight: 800; flex: 1; display: flex; align-items: center; gap: .35rem; flex-wrap: wrap; }
.topbar .user-select { background: #f3f4f6; border: 1.5px solid var(--border); color: var(--text); padding: .25rem .65rem; border-radius: 8px; font-weight: 800; font-size: .92rem; cursor: pointer; font-family: inherit; }
.topbar .force-refresh-btn { background: white; border: 1.5px solid var(--border); border-radius: 8px; padding: .25rem .55rem; cursor: pointer; font-size: 1rem; transition: transform .2s; }
.topbar .force-refresh-btn:hover { background: #fef3c7; transform: rotate(45deg); }
.topbar .force-refresh-btn:active { transform: rotate(180deg); }
.topbar .user-select:hover { background: #e5e7eb; }
.topbar .u-add { background: #fef3c7; border: 1.5px dashed #f59e0b; color: #92400e; padding: .35rem .7rem; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: .78rem; }
.topbar .u-add:hover { background: #fde68a; }
.topbar .u-add:disabled, .topbar .u-add.hidden { display: none; }
.subject-tabs { display: flex; gap: .4rem; margin-bottom: 1rem; }
.subject-tabs button { flex: 1; min-width: 0; background: white; border: 2px solid var(--border); color: var(--text-sub); padding: .65rem .3rem; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: .92rem; transition: all .15s; white-space: nowrap; }
.subject-tabs button.active { color: white; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.15); }
.subject-tabs button.active[data-subject="ya3"] { background: var(--ya3); border-color: var(--ya3); }
.subject-tabs button.active[data-subject="ya4"] { background: var(--ya4); border-color: var(--ya4); }
.subject-tabs button.active[data-subject="ya5"] { background: var(--ya5); border-color: var(--ya5); }
.subject-tabs button.active[data-subject="ya6"] { background: var(--ya6); border-color: var(--ya6); }
.info-banner { padding: .65rem .85rem; border-radius: 10px; margin-bottom: 1rem; font-size: .82rem; line-height: 1.6; position: relative; padding-right: 2.5rem; }
.info-banner.editor { background: #f0f9ff; border: 1px solid #bae6fd; color: #0c4a6e; }
.info-banner.readonly { background: #fef3c7; border: 1px solid #fbbf24; color: #92400e; font-weight: 600; }
.info-banner .banner-close { position: absolute; top: 50%; right: .55rem; transform: translateY(-50%); background: transparent; border: 1.5px solid currentColor; color: inherit; opacity: .6; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: .75rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.info-banner .banner-close:hover { opacity: 1; background: rgba(0,0,0,.05); }
.workspace { display: grid; grid-template-columns: 240px 1fr 280px; gap: 1rem; position: relative; }
.workspace.comments-collapsed { grid-template-columns: 240px 1fr; }
.workspace.comments-collapsed .comment-pane { display: none; }
@media (max-width: 1100px) {
  .workspace, .workspace.comments-collapsed { grid-template-columns: 220px 1fr; }
  .comment-pane { grid-column: 1 / -1; }
}
/* v337:手機強制單欄,不管留言收合與否 */
@media (max-width: 720px) {
  .workspace, .workspace.comments-collapsed { grid-template-columns: 1fr; }
  .chapter-list { max-height: 35vh; }
  .editor-card { min-width: 0; }
  .editor-body .view-content { font-size: .95rem; }
}
/* 浮動「展開留言」按鈕 — 只有收起時才顯示 */
.comments-open-btn { display: none; position: fixed; bottom: 1.3rem; right: 1.3rem; background: var(--ya5); color: white; border: none; border-radius: 999px; padding: .7rem 1.1rem; font-weight: 800; box-shadow: 0 4px 14px rgba(0,0,0,.18); cursor: pointer; font-size: .92rem; z-index: 100; }
.comments-open-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.22); }
.workspace.comments-collapsed ~ .comments-open-btn,
body.comments-collapsed .comments-open-btn { display: inline-block; }
.comment-pane .close-c { background: #f3f4f6; border: 1px solid var(--border); cursor: pointer; color: var(--text-sub); font-size: .78rem; line-height: 1; padding: .35rem .7rem; margin-left: auto; font-weight: 700; border-radius: 6px; }
.comment-pane .close-c:hover { background: #e5e7eb; color: var(--text); }
.comment-pane .close-c:hover { color: #ef4444; }
/* v323:留言區 */
.comment-pane { background: white; border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: 80vh; min-height: 320px; overflow: hidden; }
.comment-head { padding: .65rem .9rem; background: #fafaf5; border-bottom: 1px solid var(--border); font-weight: 800; font-size: .9rem; color: var(--text); display: flex; align-items: center; gap: .4rem; }
.comment-head .count { background: var(--ya4); color: white; font-size: .68rem; padding: .1rem .5rem; border-radius: 10px; }
.comment-list { flex: 1; overflow-y: auto; padding: .7rem .8rem; display: flex; flex-direction: column; gap: .6rem; }
.comment-empty { color: var(--text-sub); text-align: center; padding: 2rem .5rem; font-size: .82rem; font-style: italic; }
.comment-item { background: #f9fafb; border: 1px solid #f0ece0; border-radius: 8px; padding: .5rem .65rem; font-size: .85rem; line-height: 1.5; position: relative; }
.comment-item .meta { font-size: .7rem; color: var(--text-sub); margin-bottom: .2rem; display: flex; gap: .35rem; align-items: center; flex-wrap: wrap; }
.comment-item .who { font-weight: 700; color: var(--ya5); }
.comment-item .text { white-space: pre-wrap; word-break: break-word; }
.comment-item .text a { color: var(--ya5); text-decoration: underline; word-break: break-all; }
.comment-item .text a.ch-link-pill { display: inline-block; background: linear-gradient(135deg,#ede9fe,#ddd6fe); color: #5b21b6; padding: .2rem .55rem; border-radius: 12px; font-weight: 700; font-size: .8rem; text-decoration: none; border: 1px solid #c4b5fd; word-break: normal; margin: .1rem 0; }
.comment-item .text a.ch-link-pill:hover { background: linear-gradient(135deg,#ddd6fe,#c4b5fd); }
.comment-item .del-c { position: absolute; top: .3rem; right: .35rem; background: transparent; border: none; color: #d1d5db; cursor: pointer; font-size: .8rem; padding: 0 .25rem; }
.comment-item:hover .del-c { color: #ef4444; }
.comment-input-row { padding: .55rem .8rem; border-top: 1px solid var(--border); background: #fafaf5; display: flex; gap: .4rem; }
.comment-input { flex: 1; border: 1.5px solid var(--border); border-radius: 7px; padding: .4rem .55rem; font-family: inherit; font-size: .85rem; resize: none; min-height: 38px; max-height: 100px; outline: none; }
.comment-input:focus { border-color: var(--ya5); }
.comment-send { background: var(--ya5); color: white; border: none; border-radius: 7px; padding: 0 .85rem; font-weight: 700; cursor: pointer; font-size: .85rem; white-space: nowrap; }
.comment-send:disabled { background: #cbd5e1; cursor: not-allowed; }
.comment-readonly { padding: .5rem .8rem; border-top: 1px solid var(--border); font-size: .78rem; color: var(--text-sub); background: #fafaf5; text-align: center; }
.comment-pane.no-chapter .comment-list { display: none; }
.comment-pane.no-chapter .comment-input-row, .comment-pane.no-chapter .comment-readonly { display: none; }
.comment-pane.no-chapter::after { content: '⬅ 先選一章再留言'; display: flex; flex: 1; align-items: center; justify-content: center; color: var(--text-sub); font-size: .82rem; font-style: italic; padding: 1rem; }
.chapter-list { background: white; border: 1px solid var(--border); border-radius: 12px; padding: .55rem; box-shadow: var(--shadow); max-height: 80vh; overflow-y: auto; }
.chapter-list .ch-head { display: flex; align-items: center; gap: .4rem; padding: .35rem .45rem .35rem; }
.chapter-list .ch-search { width: calc(100% - .9rem); margin: .15rem .45rem .5rem; padding: .35rem .55rem; border: 1.5px solid var(--border); border-radius: 7px; font-size: .8rem; font-family: inherit; outline: none; background: #fafaf5; box-sizing: border-box; }
.chapter-list .ch-search:focus { border-color: var(--ya5); background: white; }
.chapter-list .ch-head strong { font-size: .82rem; color: var(--text-sub); flex: 1; }
.chapter-list .ch-add { background: #16a34a; color: white; border: none; padding: .35rem .75rem; border-radius: 7px; cursor: pointer; font-weight: 800; font-size: .8rem; box-shadow: 0 2px 6px rgba(22,163,74,.3); }
.chapter-list .ch-add:hover { background: #15803d; }
.chapter-list .ch-add:disabled, .chapter-list .ch-add.hidden { display: none; }
.chapter-list .ch-item { padding: .55rem .65rem; border-radius: 8px; cursor: pointer; font-size: .87rem; color: var(--text); margin-bottom: .15rem; display: flex; align-items: center; gap: .4rem; transition: background .12s; }
.chapter-list .ch-item:hover { background: #f9fafb; }
.chapter-list .ch-item.active { background: #fef3c7; font-weight: 700; }
.chapter-list .ch-item .ch-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chapter-list .ch-item .ch-del { background: none; border: none; color: #cbd5e1; cursor: pointer; padding: .15rem .35rem; border-radius: 4px; font-size: .85rem; }
.chapter-list .ch-item .ch-del:hover { color: #ef4444; background: #fef2f2; }
/* v388: 拖曳排序 */
.chapter-list .ch-item[draggable="true"] { cursor: grab; }
.chapter-list .ch-item[draggable="true"]:active { cursor: grabbing; }
.chapter-list .ch-item .ch-grip { color: #cbd5e1; font-size: .8rem; user-select: none; cursor: grab; padding-right: .2rem; }
.chapter-list .ch-item:hover .ch-grip { color: #7c3aed; }
.chapter-list .ch-item.dragging { opacity: .4; }
.chapter-list .ch-item.drag-over { border-top: 3px solid #7c3aed; padding-top: calc(.55rem - 3px); }
.chapter-list .empty { padding: 1.2rem .7rem; color: var(--text-sub); font-size: .82rem; text-align: center; font-style: italic; }
.editor-card { background: white; border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.editor-status { display: flex; align-items: center; justify-content: space-between; padding: .55rem .8rem; background: #fafaf5; border-bottom: 1px solid var(--border); font-size: .78rem; color: var(--text-sub); flex-wrap: wrap; gap: .4rem; }
.editor-status input.title-input { background: transparent; border: none; outline: none; font-size: 1.35rem; font-weight: 900; color: var(--text); flex: 1; min-width: 120px; padding: .35rem 0; letter-spacing: -.01em; }
.editor-status input.title-input:focus { border-bottom: 1.5px solid var(--ya3); }
.editor-status input.title-input:disabled { color: var(--text); cursor: default; }
@media (max-width: 600px) { .editor-status input.title-input { font-size: 1.15rem; } }
.editor-status .meta { font-size: .73rem; color: var(--text-sub); white-space: nowrap; }
.editor-status button { border: none; border-radius: 7px; cursor: pointer; font-weight: 700; }
.editor-status .save-btn { background: #16a34a; color: white; padding: .4rem .85rem; font-size: .82rem; }
.editor-status .save-btn:disabled { background: #9ca3af; cursor: not-allowed; }
.editor-status .refresh-btn, .editor-status .history-btn, .editor-status .link-btn { background: #f3f4f6; border: 1px solid var(--border); color: var(--text-sub); padding: .35rem .65rem; font-size: .78rem; font-weight: 600; }
.editor-status .link-btn:hover { background: #ede9fe; color: #5b21b6; border-color: #ddd6fe; }
.editor-status .edit-btn { background: #7c3aed; color: white; padding: .4rem .85rem; font-size: .82rem; }
.editor-status .abandon-btn { background: #fee2e2; color: #b91c1c; border: 1.5px solid #fecaca; padding: .4rem .85rem; font-size: .82rem; }
.editor-status .abandon-btn:hover { background: #fecaca; }
.editor-status .undo-btn, .editor-status .redo-btn { background: #ede9fe; color: #5b21b6; border: 1.5px solid #ddd6fe; padding: .35rem .7rem; font-size: .78rem; font-weight: 700; }
.editor-status .undo-btn:hover, .editor-status .redo-btn:hover { background: #ddd6fe; }
.draft-tag { background: #fbbf24; color: #78350f; padding: .15rem .55rem; border-radius: 999px; font-size: .7rem; font-weight: 700; }
.toolbar { display: flex; flex-wrap: wrap; gap: .25rem; padding: .5rem .55rem; background: #fafaf5; border-bottom: 1px solid var(--border); }
.toolbar button { background: white; border: 1px solid var(--border); color: var(--text); padding: .35rem .55rem; border-radius: 6px; cursor: pointer; font-size: .82rem; font-weight: 600; min-width: 32px; }
.toolbar button:hover:not(:disabled) { background: #f3f4f6; }
.toolbar button:disabled { opacity: .4; cursor: not-allowed; }
.toolbar .sep { width: 1px; background: var(--border); margin: 0 .15rem; }
.editor-body { padding: 1rem 1.2rem; min-height: 50vh; max-height: 75vh; overflow-y: auto; }
.editor-body .ProseMirror, .editor-body .view-content { outline: none; font-size: 1rem; line-height: 1.75; min-height: 45vh; }
.editor-body .ProseMirror h2, .editor-body .view-content h2 { font-size: 1.3rem; margin: 1rem 0 .5rem; font-weight: 800; }
.editor-body .ProseMirror h3, .editor-body .view-content h3 { font-size: 1.1rem; margin: .8rem 0 .3rem; font-weight: 700; color: #6b21a8; }
.editor-body .ProseMirror p, .editor-body .view-content p { margin: .35rem 0; }
.editor-body .ProseMirror ul, .editor-body .ProseMirror ol, .editor-body .view-content ul, .editor-body .view-content ol { margin: .3rem 0 .3rem 1.5rem; }
.editor-body .ProseMirror li, .editor-body .view-content li { margin: .15rem 0; }
.editor-body .ProseMirror blockquote, .editor-body .view-content blockquote { border-left: 4px solid #fbbf24; background: #fef3c7; padding: .4rem .8rem; margin: .6rem 0; border-radius: 4px; color: #92400e; }
.editor-body .ProseMirror table, .editor-body .view-content table { border-collapse: collapse; margin: .6rem 0; }
.editor-body .ProseMirror table td, .editor-body .ProseMirror table th, .editor-body .view-content table td, .editor-body .view-content table th { border: 1px solid var(--border); padding: .4rem .6rem; }
.editor-body .ProseMirror table th, .editor-body .view-content table th { background: #f3f4f6; font-weight: 700; }
.editor-body .ProseMirror strong, .editor-body .view-content strong { color: #b45309; }
.editor-body .ProseMirror img, .editor-body .view-content img { max-width: 100%; height: auto; border-radius: 8px; margin: .5rem 0; cursor: pointer; }
.editor-body .ProseMirror img.ProseMirror-selectednode { outline: 3px solid #fbbf24; }
.img-toolbar { display: none; gap: .3rem; padding: .45rem .55rem; background: #faf5ff; border-bottom: 1px solid #e9d5ff; align-items: center; flex-wrap: wrap; font-size: .78rem; }
.img-toolbar.visible { display: flex; }
.img-toolbar button { background: white; border: 1px solid #e9d5ff; color: #6b21a8; padding: .3rem .55rem; border-radius: 6px; cursor: pointer; font-size: .78rem; font-weight: 700; }
.img-toolbar button:hover { background: #ede9fe; }
.img-toolbar .img-status { color: #9ca3af; flex: 1; font-style: italic; font-size: .76rem; }
.editor-body .ProseMirror[contenteditable="false"] { background: #f9fafb; cursor: not-allowed; }
.empty-pick { padding: 4rem 1.5rem; text-align: center; color: var(--text-sub); }
.empty-pick .em { font-size: 2.5rem; margin-bottom: .5rem; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.65); backdrop-filter: blur(4px); z-index: 5000; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.modal { background: white; border-radius: 14px; padding: 1.2rem 1.4rem; max-width: 720px; width: 100%; max-height: 85vh; overflow-y: auto; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
.modal h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: .8rem; color: var(--text); }
.modal .close-x { float: right; background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--text-sub); }
.version-row { display: flex; gap: .7rem; padding: .65rem; border: 1px solid var(--border); border-radius: 10px; margin-bottom: .5rem; align-items: center; }
.version-row .v-info { flex: 1; }
.version-row .v-info .v-title { font-weight: 700; color: var(--text); font-size: .9rem; }
.version-row .v-info .v-meta { font-size: .75rem; color: var(--text-sub); margin-top: .15rem; }
.version-row .v-action { display: flex; gap: .35rem; }
.version-row .v-action button { background: #f3f4f6; border: 1px solid var(--border); color: var(--text); padding: .35rem .7rem; border-radius: 7px; cursor: pointer; font-size: .8rem; font-weight: 600; }

<script>
// v441:圖片點擊放大 lightbox — 手機看多張比較圖看不清時,點一下全螢幕放大
(function(){
  function _openImageLightbox(src){
    const old = document.getElementById('_img-lightbox');
    if (old) old.remove();
    const wrap = document.createElement('div');
    wrap.id = '_img-lightbox';
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99999;display:flex;align-items:center;justify-content:center;padding:1rem;cursor:zoom-out;touch-action:pinch-zoom;user-select:none';
    const img = document.createElement('img');
    img.src = src;
    img.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 6px 30px rgba(0,0,0,.4);touch-action:pinch-zoom';
    const closeBtn = document.createElement('button');
    closeBtn.textContent = '✕';
    closeBtn.style.cssText = 'position:absolute;top:1rem;right:1rem;background:rgba(255,255,255,.15);color:white;border:none;font-size:1.5rem;width:40px;height:40px;border-radius:50%;cursor:pointer;line-height:1;padding:0';
    const hint = document.createElement('div');
    hint.textContent = '點外面關閉 · 雙指縮放';
    hint.style.cssText = 'position:absolute;bottom:1rem;left:0;right:0;text-align:center;color:rgba(255,255,255,.55);font-size:.75rem';
    wrap.appendChild(img); wrap.appendChild(closeBtn); wrap.appendChild(hint);
    document.body.appendChild(wrap);
    const close = () => wrap.remove();
    wrap.addEventListener('click', (e) => { if (e.target === wrap) close(); });
    closeBtn.addEventListener('click', close);
    const onKey = (e) => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); } };
    document.addEventListener('keydown', onKey);
    let scale = 1;
    img.addEventListener('wheel', (e) => {
      e.preventDefault();
      scale = Math.max(0.5, Math.min(5, scale + (e.deltaY < 0 ? 0.15 : -0.15)));
      img.style.transform = 'scale(' + scale + ')';
    }, { passive: false });
  }
  window._openImageLightbox = _openImageLightbox;
  document.addEventListener('click', function(e){
    const img = e.target;
    if (!img || img.tagName !== 'IMG') return;
    const src = img.currentSrc || img.src || '';
    if (!src || src.startsWith('data:') || src.startsWith('blob:')) return;
    if (img.classList.contains('no-lightbox')) return;
    const w = img.naturalWidth || img.width || 0;
    const h = img.naturalHeight || img.height || 0;
    if (w < 80 && h < 80) return;
    if (img.closest('button, a[href]')) return;
    e.preventDefault();
    _openImageLightbox(src);
  }, false);
})();

// v440:img 載入失敗自動 fallback — 使用者反映「有時候圖片顯示不出來」
//       root cause:raw.githubusercontent / jsdelivr CDN 有時候暫時性 rate limit / 快取延遲 → 破圖
//       修法:全域 img error 監聽 → 自動輪替 GitHub 4 個 CDN 鏡像,直到有一個 load 成功
(function(){
  const CDN_CHAIN = [
    { re: /^https?:\/\/raw\.githubusercontent\.com\/([^/]+\/[^/]+)\/([^/]+)\/(.+)$/,
      to: (m) => 'https://cdn.jsdelivr.net/gh/' + m[1] + '@' + m[2] + '/' + m[3] },
    { re: /^https?:\/\/cdn\.jsdelivr\.net\/gh\/([^/]+\/[^/]+)@([^/]+)\/(.+)$/,
      to: (m) => 'https://cdn.statically.io/gh/' + m[1] + '/' + m[2] + '/' + m[3] },
    { re: /^https?:\/\/cdn\.statically\.io\/gh\/([^/]+\/[^/]+)\/([^/]+)\/(.+)$/,
      to: (m) => 'https://rawcdn.githack.com/' + m[1] + '/' + m[2] + '/' + m[3] },
    { re: /^https?:\/\/rawcdn\.githack\.com\/([^/]+\/[^/]+)\/([^/]+)\/(.+)$/,
      to: (m) => 'https://raw.githubusercontent.com/' + m[1] + '/' + m[2] + '/' + m[3] },
  ];
  window._imgFallback = function(img){
    if (!img || img.tagName !== 'IMG') return;
    const src = img.currentSrc || img.src || '';
    if (!src || src.startsWith('data:') || src.startsWith('blob:')) return;
    const strip = src.split('?')[0].split('#')[0];
    let tries = parseInt(img.dataset.cdnTries || '0', 10);
    if (tries >= CDN_CHAIN.length) return;
    for (const rule of CDN_CHAIN) {
      const m = strip.match(rule.re);
      if (m) {
        const next = rule.to(m);
        img.dataset.cdnTries = String(tries + 1);
        img.src = next + '?t=' + Date.now();
        return;
      }
    }
  };
  document.addEventListener('error', function(e){
    if (e.target && e.target.tagName === 'IMG') window._imgFallback(e.target);
  }, true);
})();

// 🎨 套用使用者的筆記本背景設定(每個使用者各自獨立)
function _uKey(k) { return CUR_USER.id + '_' + k; }
function applyUserTheme() {
  if (!document.body) return;
  // 清掉舊的 theme/bg/font class
  document.body.className = document.body.className.split(/\s+/)
    .filter(c => !c.startsWith('theme-') && !c.startsWith('bg-style-') && !c.startsWith('font-'))
    .join(' ').trim();
  const theme = localStorage.getItem(_uKey('nb_theme'));
  const bg = localStorage.getItem(_uKey('nb_bg_style'));
  const font = localStorage.getItem(_uKey('nb_font_style'));
  // v314:bg_style 存的是 'marble'/'rice' 等(沒 prefix),要加 'bg-style-' 才會吃到紋路 CSS
  //       font 同理,存 'serif' 要變 'font-serif'。theme 本來就存完整 class 名稱所以不用加
  if (theme) document.body.classList.add(theme);
  if (bg) document.body.classList.add(bg.startsWith('bg-style-') ? bg : ('bg-style-' + bg));
  if (font) document.body.classList.add(font.startsWith('font-') ? font : ('font-' + font));
  // 飽和度 / 透明度 / 漸層深淺
  const sat = parseInt(localStorage.getItem(_uKey('nb_theme_sat')) || '100');
  const opa = parseInt(localStorage.getItem(_uKey('nb_theme_opa')) || '100');
  const gstr = parseInt(localStorage.getItem(_uKey('nb_theme_gstr')) || '100');
  const parts = [];
  if (sat !== 100) parts.push(`saturate(${sat}%)`);
  if (opa !== 100) parts.push(`opacity(${opa}%)`);
  document.body.style.filter = parts.join(' ');
  document.documentElement.style.setProperty('--g-strength', String(gstr / 100));
}
applyUserTheme();

//      作法:確保本地有這個名字的 user → 把 dental_cur_user 設過去 → reload
function claimEditor(canonical) {
  try {
    const ulist = JSON.parse(localStorage.getItem('dental_users') || '[]');
    let u = ulist.find(x => (x.name || '').trim().toLowerCase() === canonical.toLowerCase());
    if (!u) {
      // 沒有就建一個
      const id = 'u_' + canonical.toLowerCase() + '_' + Math.random().toString(36).slice(2, 8);
      u = { id, name: canonical };
      ulist.push(u);
      localStorage.setItem('dental_users', JSON.stringify(ulist));
    } else if (u.name !== canonical) {
      // 拼字修正(把 shirley → Shirley)
      u.name = canonical;
      localStorage.setItem('dental_users', JSON.stringify(ulist));
    }
    localStorage.setItem('dental_cur_user', u.id);
    location.reload();
  } catch(e) {
    alert('啟用失敗:' + e.message);
  }
}

function _idbOpen() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(IDB_DB, 1);
    r.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function idbGet(key) {
  const db = await _idbOpen();
  return new Promise((resolve) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const r = tx.objectStore(IDB_STORE).get(key);
    r.onsuccess = () => { db.close(); resolve(r.result || null); };
    r.onerror = () => { db.close(); resolve(null); };
  });
}
async function idbSet(key, val) {
  const db = await _idbOpen();
  return new Promise((resolve) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => { db.close(); resolve(true); };
    tx.onerror = () => { db.close(); resolve(false); };
  });
}
async function idbDel(key) {
  const db = await _idbOpen();
  return new Promise((resolve) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = () => { db.close(); resolve(true); };
    tx.onerror = () => { db.close(); resolve(false); };
  });
}

let _fbDb = null;
function _initFb() {
  if (_fbDb) return _fbDb;
  if (typeof firebase === 'undefined') throw new Error('Firebase SDK 沒載入(網路可能擋 gstatic.com)');
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  _fbDb = firebase.database();
  return _fbDb;
}
async function fbGet(path) {
  const snap = await _initFb().ref(path).once('value');
  return snap.val();
}
async function fbSet(path, data) {
  await _initFb().ref(path).set(data);
}
async function fbPush(path, data) {
  return await _initFb().ref(path).push(data);
}
async function fbAppendVersion(ns, subj, snapshot) {
  // 把 snapshot 加進 versions 陣列,只保留最近 FB_VERSION_KEEP 個
  // 用 transaction 避免並發覆寫
  const ref = _initFb().ref(FB_VERSIONS(ns, subj));
  await ref.transaction((cur) => {
    const arr = (cur && Array.isArray(cur)) ? cur : (cur && cur.list ? cur.list : []);
    arr.push(snapshot);
    while (arr.length > FB_VERSION_KEEP) arr.shift();
    return arr;
  });
}

function getGithubToken() {
  return localStorage.getItem(CUR_USER.id + '_github_token') || localStorage.getItem('github_token') || '';
}
// v319:必須是 owner/repo 格式才生效;只填 'shirleyy' 這種帳號名會讓所有 GitHub 讀寫都失敗
//       這裡強制驗證,不合法的就回退到 REPO_DEFAULT
function _isValidRepo(s) {
  return typeof s === 'string' && /^[\w.-]+\/[\w.-]+$/.test(s.trim());
}
function getGithubRepo() {
  const userRepo = localStorage.getItem(CUR_USER.id + '_github_repo');
  if (_isValidRepo(userRepo)) return userRepo.trim();
  const globalRepo = localStorage.getItem('github_repo');
  if (_isValidRepo(globalRepo)) return globalRepo.trim();
  return REPO_DEFAULT;
}
// 🛡 chunked base64:避免大字串時 btoa/unescape 鏈炸掉 stack
function utf8ToBase64(s) {
  try {
    const bytes = new TextEncoder().encode(s);
    let binary = '';
    const chunkSize = 0x8000; // 32KB 一塊
    for (let i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
    }
    return btoa(binary);
  } catch(e) {
    console.error('[utf8ToBase64] fail', e);
    throw new Error('內容編碼失敗:' + e.message);
  }
}

async function fetchFromCdn(path) {
  const repo = getGithubRepo();
  // v318:三條 fallback 路徑,任何一條成功就回。每條都記 log 方便診斷
  const sources = [
    `https://raw.githubusercontent.com/${repo}/main/${path}`,
    `https://cdn.jsdelivr.net/gh/${repo}@main/${path}`,
    `https://gcore.jsdelivr.net/gh/${repo}@main/${path}`,
  ];
  for (let i = 0; i < sources.length; i++) {
    const url = sources[i] + `?_=${Date.now()}`;
    try {
      const r = await fetch(url, { cache: 'no-store', mode: 'cors' });
      if (r.ok) {
        return await r.json();
      }
      if (r.status === 404) {
        // 真的 404 就直接回 null,不用試其他鏡像
        console.warn('[fetchFromCdn] 404', url);
        return null;
      }
      console.warn('[fetchFromCdn] non-ok', r.status, url);
    } catch(e) {
      console.warn('[fetchFromCdn] err', sources[i], e.message);
    }
  }
  return null;
}

// 🚀 v310:有 token 走 API(api.github.com,無 CDN cache,跨裝置同步幾秒內就到)
//         沒 token 才退回 raw(可能延遲 1~5 分鐘)
async function fetchFresh(path) {
  if (getGithubToken()) {
    const { data } = await fetchFromGithub(path);
    if (data) return data;
  }
  return await fetchFromCdn(path);
}

async function fetchFromGithub(path) {
  const token = getGithubToken();
  const repo = getGithubRepo();
  if (!token) return { data: null, sha: null };
  try {
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
      headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' },
      cache: 'no-store'
    });
    if (r.status === 404) return { data: null, sha: null };
    if (!r.ok) return { data: null, sha: null };
    const d = await r.json();
    let parsed = null;
    try { parsed = JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g, ''))))); } catch(e) {}
    return { data: parsed, sha: d.sha };
  } catch(e) { return { data: null, sha: null }; }
}

async function pushToGithub(path, data, sha, message, retryCount = 0) {
  const token = getGithubToken();
  const repo = getGithubRepo();
  if (!token) throw new Error('沒設定 GitHub token(去考試 App → 設定 → GitHub)');
  const body = {
    message: message || `[mnemonics] update`,
    content: utf8ToBase64(JSON.stringify(data, null, 2))
  };
  if (sha) body.sha = sha;
  const r = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
    method: 'PUT',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json' },
    body: JSON.stringify(body)
  });
  if (!r.ok) {
    const txt = await r.text();
    if ((r.status === 409 || /sha/i.test(txt)) && retryCount < 2) {
      const fresh = await fetchFromGithub(path);
      return await pushToGithub(path, data, fresh.sha, message, retryCount + 1);
    }
    // v320:把 GitHub 原文錯誤翻成白話 + 給可執行的下一步
    if (r.status === 403 && /not accessible/i.test(txt)) {
      throw new Error(`你的 GitHub token 沒有寫入「${repo}」的權限。\n\n解法二選一:\n① 請 HUA 去 github.com/${repo}/settings/access 把你加成 collaborator,你收到邀請信點 Accept 後就會自動有權限\n② 請 HUA 給你她的 token,你在「考試 App → ⚙️ 設定 → GitHub」貼上覆蓋原本的`);
    }
    if (r.status === 401) {
      throw new Error('GitHub token 失效或拼錯。請去「考試 App → ⚙️ 設定 → GitHub」重新貼一次');
    }
    if (r.status === 404) {
      throw new Error(`找不到 repo「${repo}」。可能 token 沒給 Contents 權限,或 repo 名稱填錯`);
    }
    throw new Error('PUT 失敗 ' + r.status + ': ' + txt.slice(0, 200));
  }
}

let _contentRef = null;
function detachContent() {
  if (_contentRef) {
    try { _contentRef.off('value'); } catch(e){}
    _contentRef = null;
  }
}
async function loadUserSubject(user, subject, opts) {
  const sk = stateKey(user, subject);
  const force = opts && opts.force;
  // 1. 先放 IDB cache,讓 UI 立刻有東西可顯示
  const cache = await idbGet(k.cloud(user, subject));
  if (cache && cache.chapters) _state[sk] = cache;
  else _state[sk] = { chapters: [], ts: 0, updatedBy: '' };
  // 2. 掛 Firebase 即時監聽 — 對方任何寫入會自動推來
  detachContent();
  setLoadStatus(`☁️ 連線 ${user} · ${SUBJECT_LABEL[subject]}…`);
  let firstFire = true;
  try {
    _contentRef = _initFb().ref(FB_CONTENT(user, subject));
    _contentRef.on('value', async (snap) => {
      // 只處理目前選的 user/subject 的訊號;切換時 detachContent 會關掉舊監聽
      if (_curUser !== user || _curSubject !== subject) return;
      const remote = snap.val();
      const remoteHasContent = remote && Array.isArray(remote.chapters);
      const remoteTs = remoteHasContent ? (remote.ts || 0) : 0;
      const cur = _state[sk];
      const curTs = (cur && cur.ts) ? cur.ts : 0;
      // 第一次觸發 = 載入時的初始狀態,做一次 IDB→Firebase 補同步
      if (firstFire) {
        firstFire = false;
        const localTs = (cache && cache.ts) ? cache.ts : 0;
        if (canEditCurrent() && cache && cache.chapters && cache.chapters.length > 0 && localTs > remoteTs) {
          try {
            await fbSet(FB_CONTENT(user, subject), cache);
            setLoadStatus(`⬆️ 本地較新,已自動上傳 · ${cache.chapters.length} 章`);
            return; // 推完後 listener 會再 fire 一次帶到新狀態
          } catch(e) {
            setLoadStatus(`⚠ 自動上傳失敗:${(e.message||'').slice(0,80)}`);
          }
        }
      }
      if (!remoteHasContent) {
        setLoadStatus(`雲端是空的(${user} · ${SUBJECT_LABEL[subject]})`);
        return;
      }
      // 雲端不新於我們(包含剛剛自己存的 echo)→ 不重畫
      if (!force && remoteTs <= curTs) {
        setLoadStatus(`✓ ${user} · ${SUBJECT_LABEL[subject]} · ${remote.chapters.length} 章`);
        return;
      }
      // 採用雲端版
      _state[sk] = remote;
      await idbSet(k.cloud(user, subject), remote);
      renderChapterList();
      // 閱覽模式且當前章節內容變了 → 更新顯示;編輯中(_dirty 或 _editMode)就先不打擾
      if (_curChapterId && !_dirty && !_editMode) {
        const ch = remote.chapters.find(c => c.id === _curChapterId);
        if (ch) {
          const body = document.getElementById('editor-body');
          const ti = document.getElementById('title-input');
          if (body && body.querySelector('.view-content')) {
            body.innerHTML = '<div class="view-content">' + (ch.content || '<p style="color:#9ca3af">(空)</p>') + '</div>';
          }
          if (ti) ti.value = ch.title || '';
        } else {
          // 章節被別人刪了
          showEmptyEditor();
        }
      }
      setLoadStatus(`✓ ${user} · ${SUBJECT_LABEL[subject]} · ${remote.chapters.length} 章`);
    }, (err) => {
      setLoadStatus(`❌ Firebase 監聽失敗:${(err.message||'').slice(0,80)}`);
    });
  } catch(e) {
    setLoadStatus(`❌ 連線失敗:${(e.message||'').slice(0,80)}`);
  }
}

function setLoadStatus(msg) {
  const el = document.getElementById('load-status');
  if (el) {
    el.textContent = msg;
    el.style.opacity = '1';
    clearTimeout(setLoadStatus._t);
    setLoadStatus._t = setTimeout(() => { el.style.opacity = '.5'; }, 2500);
  }
}

const COMMENT_COLLAPSE_KEY = 'mnemonics_comments_collapsed';
// v331:預設留言區「收起」。使用者按 💬 展開後存 '0',下次記得展開
function toggleCommentPane(open) {
  const ws = document.querySelector('.workspace');
  if (!ws) return;
  if (open) {
    ws.classList.remove('comments-collapsed');
    document.body.classList.remove('comments-collapsed');
    try { localStorage.setItem(COMMENT_COLLAPSE_KEY, '0'); } catch(e){}
  } else {
    ws.classList.add('comments-collapsed');
    document.body.classList.add('comments-collapsed');
    try { localStorage.setItem(COMMENT_COLLAPSE_KEY, '1'); } catch(e){}
  }
}
// 啟動時套用:沒設定 → 預設收起;'0' → 展開;'1' → 收起
(function applySavedCollapse(){
  try {
    const saved = localStorage.getItem(COMMENT_COLLAPSE_KEY);
    const shouldCollapse = saved !== '0'; // 預設收起
    if (shouldCollapse) {
      const tryNow = () => { if (document.querySelector('.workspace')) toggleCommentPane(false); else setTimeout(tryNow, 16); };
      tryNow();
      document.addEventListener('DOMContentLoaded', () => toggleCommentPane(false));
    }
  } catch(e){}
})();

let _commentRef = null; // 目前掛載的 Firebase ref(切章節要 detach)

function loadComments(chId) {
  detachComments();

  const pane = document.getElementById('comment-pane');
  pane.classList.remove('no-chapter');

  try {
    _commentRef = _initFb().ref(FB_COMMENTS(_curUser, _curSubject, chId));
    _commentRef.on('value', (snap) => {
      const data = snap.val() || {};
      // data 是 push() 產生的 key:value map → 轉成 array 並按 ts 排序
      const arr = Object.entries(data).map(([key, v]) => ({ key, ...v }))
                  .sort((a, b) => (a.ts || 0) - (b.ts || 0));
      renderCommentList(arr);
    }, (err) => {
      document.getElementById('comment-list').innerHTML = `<div class="comment-empty">❌ 載入留言失敗:${(err.message||'').slice(0,80)}</div>`;
    });
  } catch(e) {
    document.getElementById('comment-list').innerHTML = `<div class="comment-empty">❌ ${(e.message||'').slice(0,80)}</div>`;
  }
}
// v330:把留言裡的 URL 變成可點。mnemonics deep link 變漂亮的章節 pill
function linkifyCommentText(text) {
  if (!text) return '';
  const urlRe = /https?:\/\/[^\s]+/g;
  let out = '';
  let last = 0;
  let m;
  while ((m = urlRe.exec(text)) !== null) {
    out += escapeHtml(text.slice(last, m.index));
    out += _renderLinkInComment(m[0]);
    last = m.index + m[0].length;
  }
  out += escapeHtml(text.slice(last));
  return out;
}
function _renderLinkInComment(url) {
  // 是 mnemonics deep link → 渲染成 pill,點下去跳章節
  const hashIdx = url.indexOf('mnemonics.html#');
  if (hashIdx >= 0) {
    const hash = url.slice(hashIdx + 'mnemonics.html#'.length);
    const params = {};
    hash.split('&').forEach(kv => {
      const [k, v] = kv.split('=');
      if (k) params[k] = decodeURIComponent(v || '');
    });
    const ns = params.n || params.ns || '';
    const subj = params.s || params.subj || '';
    const ch = params.c || params.ch || '';
    let label = '章節連結';
    const sj = _state[stateKey(ns, subj)];
    if (sj && sj.chapters) {
      const found = sj.chapters.find(c => c.id === ch);
      if (found && found.title) label = found.title;
    }
    const subjLbl = SUBJECT_LABEL[subj] || subj;
    const safeNs = ns.replace(/['"\\]/g,'');
    const safeSubj = subj.replace(/['"\\]/g,'');
    const safeCh = ch.replace(/['"\\]/g,'');
    return `<a href="${escapeHtml(url)}" class="ch-link-pill" onclick="return jumpToChapterLink(event,'${safeNs}','${safeSubj}','${safeCh}')">📖 ${escapeHtml(subjLbl)} · ${escapeHtml(label)}</a>`;
  }
  // 一般網址 → 開新分頁
  return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(url)}</a>`;
}
function renderCommentList(arr) {
  const list = document.getElementById('comment-list');
  const count = document.getElementById('comment-count');
  const openCount = document.getElementById('comments-open-count');
  if (!list) return;
  count.textContent = String(arr.length);
  if (openCount) openCount.textContent = String(arr.length);
  if (!arr.length) {
    list.innerHTML = '<div class="comment-empty">還沒有留言 ✏️</div>';
    return;
  }
  const me = (CUR_USER.name || '').trim().toLowerCase();
  list.innerHTML = arr.map(c => {
    const isMine = (c.by || '').trim().toLowerCase() === me;
    const dt = c.ts ? new Date(c.ts).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
    const delBtn = (CAN_EDIT && isMine) ? `<button class="del-c" onclick="deleteComment('${c.key}')" title="刪除這則留言">✕</button>` : '';
    return `<div class="comment-item">
      ${delBtn}
      <div class="meta"><span class="who">${escapeHtml(c.by || '?')}</span> · ${dt}</div>
      <div class="text">${linkifyCommentText(c.text || '')}</div>
    </div>`;
  }).join('');
  // 自動捲到最底
  list.scrollTop = list.scrollHeight;
}
async function sendComment() {
  if (!CAN_EDIT) { showToast('沒有編輯權限'); return; }
  if (!_curChapterId) { showToast('請先選一章'); return; }
  const inp = document.getElementById('comment-input');
  const text = (inp.value || '').trim();
  if (!text) return;
  if (text.length > 2000) { showToast('留言太長(限 2000 字)'); return; }
  const btn = document.getElementById('comment-send');
  btn.disabled = true;
  try {
    await fbPush(FB_COMMENTS(_curUser, _curSubject, _curChapterId), {
      by: CUR_USER.name || 'Guest',
      ts: Date.now(),
      text,
    });
    inp.value = '';
  } catch(e) {
    showToast('送出失敗:' + (e.message||'').slice(0,60));
  } finally {
    btn.disabled = false;
    inp.focus();
  }
}
async function deleteComment(key) {
  if (!CAN_EDIT) return;
  if (!confirm('刪掉這則留言?')) return;
  try {
    await _initFb().ref(`${FB_COMMENTS(_curUser, _curSubject, _curChapterId)}/${key}`).remove();
  } catch(e) {
    showToast('刪除失敗:' + (e.message||'').slice(0,60));
  }
}

function curState() {
  return _state[stateKey(_curUser, _curSubject)];
}

// ──────────────────────────────────────────────────────────
// v329:複製章節連結 + 解析 URL hash 深連結
//      hash 格式:#ns=HUA&subj=ya5&ch=ch_xxx
// ──────────────────────────────────────────────────────────
function copyChapterLink() {
  if (!_curChapterId) { showToast('請先選一章再複製'); return; }
  // v330:縮短參數名 ns→n, subj→s, ch→c
  const hash = `#n=${encodeURIComponent(_curUser)}&s=${_curSubject}&c=${encodeURIComponent(_curChapterId)}`;
  const url = location.origin + location.pathname + hash;
  const subj = curState();
  const ch = subj && subj.chapters.find(c => c.id === _curChapterId);
  const title = ch ? ch.title : '章節';
  // 嘗試現代 Clipboard API
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = url; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast(`🔗 已複製「${title}」的連結`); }
    catch(e) { showToast('複製失敗,請手動複製:' + url); }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(
      () => showToast(`🔗 已複製「${title}」的連結`),
      () => fallback()
    );
  } else {
    fallback();
  }
}

// 解析 URL hash,跳到指定 (ns, subj, ch)。同時接受 n/s/c(短)和 ns/subj/ch(舊版)
async function _applyDeepLinkFromHash() {
  const h = location.hash || '';
  if (!h.startsWith('#')) return false;
  const params = {};
  h.slice(1).split('&').forEach(kv => {
    const [k, v] = kv.split('=');
    if (k) params[k] = decodeURIComponent(v || '');
  });
  const ns = params.n || params.ns;
  const subj = params.s || params.subj;
  const ch = params.c || params.ch;
  if (!ns && !subj && !ch) return false;
  if (ns && _users.includes(ns)) {
    _curUser = ns;
    const sel = document.getElementById('user-select');
    if (sel) sel.value = ns;
    renderUserTabs();
  }
  if (subj && ['ya3','ya4','ya5','ya6'].includes(subj)) {
    await switchSubject(subj);
  }
  if (ch) {
    let tries = 30;
    const tryPick = () => {
      const sj = curState();
      if (sj && sj.chapters && sj.chapters.find(c => c.id === ch)) {
        pickChapter(ch);
        return;
      }
      if (--tries > 0) setTimeout(tryPick, 100);
    };
    tryPick();
  }
  return true;
}

// v330:供留言裡的章節 pill 點擊用 — 改 hash → hashchange listener 接手
function jumpToChapterLink(ev, ns, subj, ch) {
  if (ev) ev.preventDefault();
  const newHash = `#n=${encodeURIComponent(ns)}&s=${encodeURIComponent(subj)}&c=${encodeURIComponent(ch)}`;
  if (location.hash === newHash) {
    // 同樣 hash 不觸發 hashchange,直接 call
    _applyDeepLinkFromHash();
  } else {
    location.hash = newHash;
  }
  return false;
}
// 監聽 hash 改變(留言裡點連結,網址只是 hash 換,不會 reload)

let _searchTimer = null;
async function onChSearch() {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => doSearch(), 200);

async function doSearch() {
  const inp = document.getElementById('ch-search');
  const q = (inp ? inp.value : '').trim().toLowerCase();
  if (!q) {
    // 清空 → 還原章節列為當前科目
    renderChapterList();
    return;
  }
  // v334:跨「所有 namespace × 四科」搜尋
  const SUBJECTS = ['ya3','ya4','ya5','ya6'];
  const NAMESPACES = _users.length ? _users.slice() : ['HUA', '腦洞大開'];
  // 確保每個 (ns, subject) 至少有 IDB cache(沒 Firebase 即時資料也能搜)
  const promises = [];
  for (const ns of NAMESPACES) {
    for (const s of SUBJECTS) {
      const sk = stateKey(ns, s);
      if (_state[sk] && _state[sk].chapters) continue;
      promises.push((async () => {
        const cache = await idbGet(k.cloud(ns, s));
        if (cache && cache.chapters) _state[sk] = cache;
        else {
          // IDB 沒就拉 Firebase 一次性
          try {
            const remote = await fbGet(FB_CONTENT(ns, s));
            if (remote && remote.chapters) {
              _state[sk] = remote;
              await idbSet(k.cloud(ns, s), remote);
            }
          } catch(e) {}
        }
      })());
    }
  }
  await Promise.all(promises);
  // 跨所有區搜尋
  const hits = [];
  for (const ns of NAMESPACES) {
    for (const s of SUBJECTS) {
      const sj = _state[stateKey(ns, s)];
      if (!sj || !sj.chapters) continue;
      sj.chapters.forEach(ch => {
        const title = (ch.title || '').toLowerCase();
        const plain = (ch.content || '').replace(/<[^>]+>/g, ' ').toLowerCase();
        if (title.includes(q) || plain.includes(q)) {
          let snippet = '';
          const idx = plain.indexOf(q);
          if (idx >= 0) {
            const start = Math.max(0, idx - 20);
            snippet = (start > 0 ? '…' : '') + plain.slice(start, idx + q.length + 30).trim();
          }
          hits.push({ ns, subj: s, ch, snippet });
        }
      });
    }
  }
  renderSearchResults(hits, q);
}
function renderSearchResults(hits, q) {
  const container = document.getElementById('ch-items');
  if (!container) return;
  if (!hits.length) {
    container.innerHTML = `<div style="padding:1rem .5rem;color:var(--text-sub);text-align:center;font-size:.85rem">找不到「${escapeHtml(q)}」</div>`;
    return;
  }

    const subjLbl = SUBJECT_LABEL[h.subj] || h.subj;
    const sameNs = h.ns === _curUser;
    const nsBadge = sameNs
      ? ''

    return `<div class="ch-item" style="border-left:3px solid var(--ya5);padding-left:.5rem" onclick="gotoSearchHit('${escapeHtml(h.ns)}','${h.subj}','${h.ch.id}')">
      <div style="display:flex;flex-direction:column;gap:.15rem;width:100%">
        <div style="display:flex;gap:.3rem;align-items:center;flex-wrap:wrap">
          ${nsBadge}<span style="background:var(--ya5);color:white;font-size:.65rem;padding:.05rem .35rem;border-radius:8px;font-weight:700">${subjLbl}</span>
          <span class="ch-title" style="font-weight:700">${escapeHtml(h.ch.title || '(無標題)')}</span>

// v388: 章節拖曳排序
let _dragChId = null;
function _dragChStart(e, id){
  _dragChId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('dragging');
}
function _dragChOver(e){
  if (!_dragChId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}
function _dragChLeave(e){
  e.currentTarget.classList.remove('drag-over');
}
function _dragChEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.ch-item.drag-over').forEach(el => el.classList.remove('drag-over'));
}
async function _dragChDrop(e, targetId){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const fromId = _dragChId;
  _dragChId = null;
  if (!fromId || fromId === targetId) return;
  await reorderChapters(fromId, targetId);
}
async function reorderChapters(fromId, toId){
  if (!canEditCurrent()) return;
  const subj = curState();
  if (!subj || !Array.isArray(subj.chapters)) return;
  const fromIdx = subj.chapters.findIndex(c => c.id === fromId);
  const toIdx = subj.chapters.findIndex(c => c.id === toId);
  if (fromIdx < 0 || toIdx < 0 || fromIdx === toIdx) return;
  const [moved] = subj.chapters.splice(fromIdx, 1);
  // 插入到 target 位置 (拖到誰前面就放誰前面)
  const newToIdx = subj.chapters.findIndex(c => c.id === toId);
  subj.chapters.splice(newToIdx, 0, moved);
  subj.ts = Date.now();
  subj.updatedBy = CUR_USER.name || 'Guest';
  await idbSet(k.cloud(_curUser, _curSubject), subj);
  renderChapterList();
  try {
    await fbSet(FB_CONTENT(_curUser, _curSubject), subj);
    await fbAppendVersion(_curUser, _curSubject, {
      ts: subj.ts, by: CUR_USER.name, action: `調整章節順序`, snapshot: subj
    });
  } catch(err){
    console.error('[reorder fb] fail', err);
    showToast('本機已動,雲端同步失敗:' + (err.message||'').slice(0,50));
  }
}

// v329:把本機 IDB 裡 cloud_腦動大開_* / draft_腦動大開_* 自動搬到 腦洞大開,避免 Shirley 在 Mac 寫的「咬合修磨」丟失
async function _migrateLocalChineseTypo() {
  const flag = 'mn_migrated_typo_v329';
  if (localStorage.getItem(flag)) return;
  const SUBJECTS = ['ya3', 'ya4', 'ya5', 'ya6'];
  for (const s of SUBJECTS) {
    const oldCloud = `cloud_腦動大開_${s}`;
    const newCloud = `cloud_腦洞大開_${s}`;
    const old = await idbGet(oldCloud);
    if (old && !(await idbGet(newCloud))) {
      await idbSet(newCloud, old);
    }
    if (old) await idbDel(oldCloud);
  }
  try { localStorage.setItem(flag, '1'); } catch(e){}
}
_migrateLocalChineseTypo();

async function loadUsersList() {
  // 1. 本機 IDB
  const cache = await idbGet(k.usersList);
  if (cache && Array.isArray(cache) && cache.length) _users = _migrateUsers(cache.slice());
  else _users = DEFAULT_USERS.slice();
  // 本機遷移後存回
  await idbSet(k.usersList, _users);
  // 2. 背景拉 Firebase
  fbGet(FB_USERS).then(async (remote) => {
    if (!remote || !Array.isArray(remote.users)) return;
    const cleaned = _migrateUsers(remote.users.slice());
    const set = new Set(_users);
    let added = false;
    cleaned.forEach(u => { if (!set.has(u)) { _users.push(u); set.add(u); added = true; } });
    if (added) {
      await idbSet(k.usersList, _users);
      renderUserTabs();
    }
  }).catch(() => {});
}

// 切換閱覽 / 編輯(編輯模式才 lazy load TipTap)
async function toggleEditMode() {
  if (!canEditCurrent()) { showToast('🔒 沒有編輯權限'); return; }
  if (!_curChapterId) { showToast('請先從左邊選一章,或按「+ 新增」'); return; }
  if (!_editMode) {
    // 進入編輯:lazy load TipTap(只第一次需要載)
    const body = document.getElementById('editor-body');
    const subj = curState();
    const ch = subj && subj.chapters.find(c => c.id === _curChapterId);
    if (!ch) return;
    // 拿掉 viewer 並顯示載入
    const draft = await idbGet(k.draft(_curUser, _curSubject, _curChapterId));
    const initialHTML = (draft && draft.content) || ch.content || '<p></p>';
    body.innerHTML = '<div style="text-align:center;padding:2rem;color:#9ca3af">⏳ 載入編輯器…</div>';
    try {
      await initEditorOnce();
      if (_editor) {
        _editor.commands.setContent(initialHTML);
        _editor.setEditable(true);
        _editMode = true;
        _dirty = !!draft;
        refreshStatusUI();
        _editor.commands.focus();
      }
    } catch(e) {
      body.innerHTML = '<div style="padding:1.5rem;color:#dc2626;text-align:center">❌ 編輯器載入失敗:' + e.message + '<br><br>網路問題,刷新重試</div>';
    }
  } else {
    // 回閱覽模式
    if (_dirty && !confirm('有未儲存的草稿,要切回閱覽嗎?(草稿會保留在 IDB,不會掉)')) return;
    // 把目前內容存回 draft(若有 dirty)
    if (_dirty && _editor) {
      await idbSet(k.draft(_curUser, _curSubject, _curChapterId),
        { content: _editor.getHTML(), title: document.getElementById('title-input').value, ts: Date.now() });
    }
    _editMode = false;
    const subj = curState();
    const ch = subj && subj.chapters.find(c => c.id === _curChapterId);
    if (_editor) { try { _editor.destroy(); } catch(e){} _editor = null; }
    const body = document.getElementById('editor-body');
    body.innerHTML = '<div class="view-content">' + (ch ? ch.content : '') + '</div>';
    refreshStatusUI();
  }
}

// 儲存後切回閱覽
async function saveAndExit() {
  if (!_curChapterId) return;
  // 記下儲存前的內容當作 undo 點
  const subj = curState();
  const ch = subj && subj.chapters.find(c => c.id === _curChapterId);
  if (ch) {
    _undoMap[_curChapterId] = { title: ch.title, content: ch.content };
    delete _redoMap[_curChapterId]; // 新的儲存會清掉 redo
  }
  await saveToCloud();
  if (!_dirty) {
    _editMode = false;
    if (_editor) { try { _editor.destroy(); } catch(e){} _editor = null; }
    const subj = curState();
    const ch = subj && _curChapterId && subj.chapters.find(c => c.id === _curChapterId);
    const body = document.getElementById('editor-body');
    body.innerHTML = '<div class="view-content">' + (ch ? ch.content : '') + '</div>';
    refreshStatusUI();
  }
}

// 放棄儲存:回到上次儲存的內容,退出編輯
async function discardChanges() {
  if (!canEditCurrent() || !_curChapterId) return;
  if (_dirty && !confirm('放棄目前所有修改,回到上次儲存的版本?')) return;
  await idbDel(k.draft(_curUser, _curSubject, _curChapterId));
  const subj = curState();
  const ch = subj && subj.chapters.find(c => c.id === _curChapterId);
  _dirty = false;
  _editMode = false;
  if (_editor) { try { _editor.destroy(); } catch(e){} _editor = null; }
  const body = document.getElementById('editor-body');
  body.innerHTML = '<div class="view-content">' + (ch ? ch.content : '') + '</div>';
  if (ch) document.getElementById('title-input').value = ch.title || '';
  refreshStatusUI();
  showToast('已放棄修改');
}

// 回復:把章節內容換回上次儲存前的版本(同時排入 redo)
async function undoLastSave() {
  if (!canEditCurrent() || !_curChapterId) return;
  const prev = _undoMap[_curChapterId];
  if (!prev) { showToast('沒有可回復的版本'); return; }
  if (!confirm('回復到上次儲存前的版本?\n\n(目前內容會放進「取消回復」可以救回來)')) return;
  const subj = curState();
  const ch = subj && subj.chapters.find(c => c.id === _curChapterId);
  if (!ch) return;
  _redoMap[_curChapterId] = { title: ch.title, content: ch.content };
  ch.title = prev.title;
  ch.content = prev.content;
  ch.ts = Date.now();
  ch.updatedBy = CUR_USER.name || 'Guest';
  delete _undoMap[_curChapterId];
  _dirty = true;
  if (_editor) _editor.commands.setContent(prev.content || '<p></p>');
  document.getElementById('title-input').value = prev.title || '';
  await saveToCloud();
  refreshStatusUI();
  showToast('已回復');
}

async function redoLastUndo() {
  if (!canEditCurrent() || !_curChapterId) return;
  const r = _redoMap[_curChapterId];
  if (!r) { showToast('沒有可取消的回復'); return; }
  const subj = curState();
  const ch = subj && subj.chapters.find(c => c.id === _curChapterId);
  if (!ch) return;
  _undoMap[_curChapterId] = { title: ch.title, content: ch.content };
  ch.title = r.title;
  ch.content = r.content;
  ch.ts = Date.now();
  ch.updatedBy = CUR_USER.name || 'Guest';
  delete _redoMap[_curChapterId];
  _dirty = true;
  if (_editor) _editor.commands.setContent(r.content || '<p></p>');
  document.getElementById('title-input').value = r.title || '';
  await saveToCloud();
  refreshStatusUI();
  showToast('已取消回復');
}

async function addChapter() {
  if (!canEditCurrent()) { showToast('你沒有編輯權限'); return; }
  const title = prompt(`在「${_curUser}・${SUBJECT_LABEL[_curSubject]}」新增章節,標題:`, '新章節');
  if (!title || !title.trim()) return;
  let subj = curState();
  if (!subj) {
    subj = { chapters: [], ts: 0, updatedBy: '' };
    _state[stateKey(_curUser, _curSubject)] = subj;
  }
  if (!subj.chapters) subj.chapters = [];
  const newCh = {
    id: genChId(),
    title: title.trim(),
    content: '<p></p>',
    ts: Date.now(),
    updatedBy: CUR_USER.name || 'Guest'
  };
  subj.chapters.push(newCh);
  subj.ts = Date.now();
  subj.updatedBy = CUR_USER.name || 'Guest';
  // v318:立刻持久化到本機,避免關頁就消失
  await idbSet(k.cloud(_curUser, _curSubject), subj);
  _dirty = true;
  await pickChapter(newCh.id);
  // 新增完自動進編輯模式(lazy load TipTap)
  await toggleEditMode();
  _dirty = true;
  refreshStatusUI();
  showToast('新章節已建立,寫完按💾儲存(會推到雲端讓其他人看到)');
}

async function deleteChapter(chId) {
  if (!canEditCurrent()) return;
  const subj = curState();
  if (!subj) return;
  const ch = subj.chapters.find(c => c.id === chId);
  if (!ch) return;
  if (!confirm(`刪除「${ch.title}」(${_curUser})?\n\n刪掉後可從「📜 歷史」找回上一次 commit 的版本。`)) return;
  // 本機刪除(GitHub commit 自然會記錄這次刪除)
  subj.chapters = subj.chapters.filter(c => c.id !== chId);
  subj.ts = Date.now();
  subj.updatedBy = CUR_USER.name || 'Guest';
  await idbDel(k.draft(_curUser, _curSubject, chId));
  await idbSet(k.cloud(_curUser, _curSubject), subj);
  if (_curChapterId === chId) {
    _curChapterId = subj.chapters[0] ? subj.chapters[0].id : null;
    _editMode = false;
    if (_editor) _editor.setEditable(false);
    if (_curChapterId) await pickChapter(_curChapterId);
    else showEmptyEditor();
  }
  renderChapterList();
  // 3. v322:推到 Firebase
  showToast('🗑 刪除中…');
  try {
    await fbSet(FB_CONTENT(_curUser, _curSubject), subj);
    await fbAppendVersion(_curUser, _curSubject, {
      ts: subj.ts, by: CUR_USER.name, action: `delete「${ch.title}」`, snapshot: subj
    });
    showToast('🗑 已刪除(雲端同步完成)');
  } catch(e) {
    console.error('[delete fb] fail', e);
    showToast('🗑 本機已刪,雲端同步失敗:' + (e.message||'').slice(0,60));
  }
}

// ──────────────────────────────────────────────────────────
// 雲端同步(v322:Firebase)
// ──────────────────────────────────────────────────────────
async function refreshFromCloud() {
  if (_dirty) {
    if (!confirm('有未儲存草稿,刷新會用雲端版覆蓋。要繼續?')) return;
    if (_curChapterId) await idbDel(k.draft(_curUser, _curSubject, _curChapterId));
  }
  showToast('🔄 拉雲端最新…');
  const remote = await fbGet(FB_CONTENT(_curUser, _curSubject));
  if (remote && remote.chapters) {
    _state[stateKey(_curUser, _curSubject)] = remote;
    await idbSet(k.cloud(_curUser, _curSubject), remote);
    renderChapterList();
    if (_curChapterId) {
      const ch = remote.chapters.find(c => c.id === _curChapterId);
      if (ch && _editor) {
        _editor.commands.setContent(ch.content || '<p></p>');
        document.getElementById('title-input').value = ch.title || '';
      }
    }
    _dirty = false;
    refreshStatusUI();
    showToast('✓ 已是最新');
  } else {
    showToast('❌ 拉不到(可能還沒人推過)');
  }
}

async function saveToCloud() {
  if (!canEditCurrent()) return;
  // v322:文字內容存 Firebase,不再需要 GitHub token
  const subj = curState();
  if (!subj) { showToast('沒有內容'); return; }
  if (_curChapterId) {
    const ch = subj.chapters.find(c => c.id === _curChapterId);
    if (ch && _editor) {
      const newTitle = document.getElementById('title-input').value.trim() || ch.title;
      ch.title = newTitle;
      ch.content = _editor.getHTML();
      ch.ts = Date.now();
      ch.updatedBy = CUR_USER.name || 'Guest';
    }
  }
  subj.ts = Date.now();
  subj.updatedBy = CUR_USER.name || 'Guest';

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = '⏳ 推送中…';
  try {
    // 推 Firebase + 留版本快照
    await fbSet(FB_CONTENT(_curUser, _curSubject), subj);
    const chTitle = _curChapterId ? (subj.chapters.find(c => c.id === _curChapterId)?.title || '') : '';
    await fbAppendVersion(_curUser, _curSubject, {
      ts: subj.ts,
      by: CUR_USER.name || 'Guest',
      action: chTitle ? `編輯「${chTitle}」` : '更新',
      snapshot: subj,
    });
    await idbSet(k.cloud(_curUser, _curSubject), subj);
    if (_curChapterId) await idbDel(k.draft(_curUser, _curSubject, _curChapterId));
    _dirty = false;
    refreshStatusUI();
    renderChapterList();
    showToast('✅ 已推到雲端');
  } catch(e) {
    console.error('[saveToCloud] failed', e);
    alert('儲存失敗:' + (e.message || e) + '\n\n本機草稿還在 IDB,不會掉。');
    btn.disabled = false;
    btn.textContent = '💾 重試';
  }
}

// ──────────────────────────────────────────────────────────
// 版本歷史 modal(v322:存 Firebase,保留最近 30 個快照)
// ──────────────────────────────────────────────────────────
async function openVersionModal() {
  showVersionModalContent('<div style="text-align:center;padding:2rem;color:#9ca3af">⏳ 從雲端拉歷史…</div>');
  try {
    const arr = await fbGet(FB_VERSIONS(_curUser, _curSubject));
    const versions = Array.isArray(arr) ? arr : (arr && arr.list ? arr.list : []);
    if (!versions.length) {
      showVersionModalContent('<div style="text-align:center;color:#9ca3af;padding:2rem">還沒有任何儲存紀錄</div>');
      return;
    }
    // 反序顯示(最新在前)
    const sorted = versions.slice().reverse();
    window._versionList = sorted;
    const rows = sorted.map((v, i) => {
      const dt = v.ts ? new Date(v.ts).toLocaleString('zh-TW') : '';
      const action = v.action || '更新';
      return `<div class="version-row">
        <div class="v-info">
          <div class="v-title">${escapeHtml(action)}</div>
          <div class="v-meta">${escapeHtml(v.by || '?')} · ${dt}</div>
        </div>
        <div class="v-action">
          <button onclick="previewVersion(${i})">👁 預覽</button>
          ${canEditCurrent() ? `<button class="restore" onclick="restoreFromVersion(${i})">↶ 還原</button>` : ''}
        </div>
      </div>`;
    }).join('');
    showVersionModalContent('<div style="font-size:.85rem;color:#6b7280">共 ' + sorted.length + ' 個版本(保留最近 30 個,自動丟最舊)</div><br>' + rows);
  } catch(e) {
    showVersionModalContent('<div style="color:#dc2626;padding:1rem">❌ 拉歷史失敗: ' + e.message + '</div>');
  }
}

async function previewVersion(idx) {
  const v = window._versionList && window._versionList[idx];
  if (!v || !v.snapshot) return;
  const data = v.snapshot;
  const ch = _curChapterId ? (data.chapters || []).find(x => x.id === _curChapterId) : (data.chapters || [])[0];
  if (!ch) {
    showVersionModalContent('<div style="color:#dc2626;padding:1rem">這版裡找不到目前章節(可能那時還沒建)</div><div style="margin-top:1rem"><button onclick="openVersionModal()" style="background:#f3f4f6;border:1px solid #e5e7eb;padding:.45rem .9rem;border-radius:7px;cursor:pointer;font-weight:600">← 回列表</button></div>');
    return;
  }
  const html = '<h3 style="margin-bottom:.5rem">' + escapeHtml(ch.title || '(無標題)') + '</h3>'
    + '<div class="version-preview">' + (ch.content || '<p>(空)</p>') + '</div>'
    + '<div style="margin-top:1rem;display:flex;gap:.5rem;justify-content:flex-end">'
    + '<button onclick="openVersionModal()" style="background:#f3f4f6;border:1px solid #e5e7eb;padding:.45rem .9rem;border-radius:7px;cursor:pointer;font-weight:600">← 回列表</button>'
    + (canEditCurrent() ? '<button onclick="restoreFromVersion(' + idx + ')" style="background:#16a34a;color:white;border:none;padding:.45rem .9rem;border-radius:7px;cursor:pointer;font-weight:700">↶ 還原到這版</button>' : '')
    + '</div>';
  showVersionModalContent(html);
}

async function restoreFromVersion(idx) {
  if (!canEditCurrent()) return;
  const v = window._versionList && window._versionList[idx];
  if (!v || !v.snapshot) return;
  if (!confirm('還原到「' + new Date(v.ts || 0).toLocaleString('zh-TW') + '」的版本?\n\n會覆蓋當前章節內容,這次還原本身也會留新版本,之後可以再從歷史救回。')) return;
  try {
    const data = v.snapshot;
    const ch = (data.chapters || []).find(x => x.id === _curChapterId);
    if (!ch) { alert('這版找不到目前章節'); return; }
    const subj = curState();
    const curCh = subj.chapters.find(x => x.id === _curChapterId);
    _undoMap[_curChapterId] = { title: curCh.title, content: curCh.content };
    curCh.title = ch.title;
    curCh.content = ch.content;
    curCh.ts = Date.now();
    curCh.updatedBy = CUR_USER.name || 'Guest';
    _dirty = true;
    if (_editor) _editor.commands.setContent(ch.content || '<p></p>');
    document.getElementById('title-input').value = ch.title || '';
    closeVersionModal();
    await saveToCloud();
    refreshStatusUI();
    showToast('✅ 已還原');
  } catch(e) {
    alert('還原失敗:' + e.message);
  }
}

function showVersionModalContent(html) {
  let overlay = document.getElementById('version-modal');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'version-modal';
    overlay.className = 'modal-overlay';
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = `<div class="modal">
    <button class="close-x" onclick="closeVersionModal()">✕</button>
    <h2>📜 ${_curUser} · ${SUBJECT_NAME[_curSubject]} 編輯歷史</h2>
    <div id="version-body">${html}</div>
  </div>`;
  overlay.onclick = (e) => { if (e.target === overlay) closeVersionModal(); };
}
function closeVersionModal() {
  const o = document.getElementById('version-modal');
  if (o) o.remove();
}

function previewVersion(idx) {
  const v = window._versionList[idx];
  if (!v || !v.snapshotBefore) return;
  const html = '<h3 style="margin-bottom:.5rem">' + escapeHtml(v.snapshotBefore.title || '(無標題)') + '</h3>'
    + '<div class="version-preview">' + (v.snapshotBefore.content || '<p>(空)</p>') + '</div>'
    + '<div style="margin-top:1rem;display:flex;gap:.5rem;justify-content:flex-end">'
    + '<button onclick="openVersionModal()" style="background:#f3f4f6;border:1px solid #e5e7eb;padding:.45rem .9rem;border-radius:7px;cursor:pointer;font-weight:600">← 回列表</button>'
    + (canEditCurrent() ? '<button onclick="restoreVersion(' + idx + ')" style="background:#16a34a;color:white;border:none;padding:.45rem .9rem;border-radius:7px;cursor:pointer;font-weight:700">↶ 還原到這版</button>' : '')
    + '</div>';
  showVersionModalContent(html);

async function restoreVersion(idx) {
  if (!canEditCurrent()) return;
  const v = window._versionList[idx];
  if (!v || !v.snapshotBefore) return;
  if (!confirm('確定還原「' + (v.snapshotBefore.title || '該章節') + '」到 ' + new Date(v.ts).toLocaleString('zh-TW') + ' 的版本?\n\n會覆蓋當前內容,但會另外留新版本快照,可以再還原回現在。')) return;
  const subj = curState();
  if (!subj) return;
  let ch = subj.chapters.find(c => c.id === v.chapterId);
  if (!ch) {
    // 章節已被刪 → 還原 = 新增回去
    ch = {
      id: v.chapterId,
      title: v.snapshotBefore.title,
      content: v.snapshotBefore.content,
      ts: Date.now(),
      updatedBy: CUR_USER.name || 'Guest'
    };
    subj.chapters.push(ch);
  } else {
    ch.title = v.snapshotBefore.title;
    ch.content = v.snapshotBefore.content;
    ch.ts = Date.now();
    ch.updatedBy = CUR_USER.name || 'Guest';
  }
  _curChapterId = ch.id;
  _dirty = true;
  closeVersionModal();
  renderChapterList();
  pickChapter(ch.id);
  showToast('已還原,記得按 💾 推到雲端');
}

// ──────────────────────────────────────────────────────────
// 編輯器初始化
// ──────────────────────────────────────────────────────────
let _coreModules = null;
// 🛡 esm.sh 偶爾在手機掛掉,加 fallback CDN + 自動重試
const CDN_BASES = [
  'https://esm.sh/',
  'https://esm.run/',
  'https://cdn.skypack.dev/'
];
async function importWithFallback(path) {
  let lastErr = null;
  for (const base of CDN_BASES) {
    try { return await import(base + path); }
    catch(e) { lastErr = e; console.warn('[import retry]', base + path, e.message); }
  }
  // 全部失敗 → 再試 esm.sh 一次(也許是暫時 hiccup)
  try { return await import('https://esm.sh/' + path); }
  catch(e) { throw lastErr || e; }
}
async function loadTipTapModules() {
  if (_coreModules) return _coreModules;
  const [core, StarterKitMod, UnderlineMod, HighlightMod, TableMod, TableRowMod, TableHeaderMod, TableCellMod, TextAlignMod, ImageMod] = await Promise.all([
    importWithFallback('@tiptap/core@2'),
    importWithFallback('@tiptap/starter-kit@2'),
    importWithFallback('@tiptap/extension-underline@2'),
    importWithFallback('@tiptap/extension-highlight@2'),
    importWithFallback('@tiptap/extension-table@2'),
    importWithFallback('@tiptap/extension-table-row@2'),
    importWithFallback('@tiptap/extension-table-header@2'),
    importWithFallback('@tiptap/extension-table-cell@2'),
    importWithFallback('@tiptap/extension-text-align@2'),
    importWithFallback('@tiptap/extension-image@2'),
  ]);
  const StarterKit = StarterKitMod.default;
  const Underline = UnderlineMod.default;
  const Highlight = HighlightMod.default;
  const Table = TableMod.default;
  const TableRow = TableRowMod.default;
  const TableHeader = TableHeaderMod.default;
  const TableCell = TableCellMod.default;
  const TextAlign = TextAlignMod.default;
  const Image = ImageMod.default;
  // 🖼 ResizableImage:把 width 當 attribute,渲染成 style:width:XX% — 跟筆記本一樣
  const ResizableImage = Image.extend({
    addAttributes(){
      return {
        ...this.parent?.(),
        width: {
          default: null,
          parseHTML: el => {
            const style = el.getAttribute('style') || '';
            const m = style.match(/width\s*:\s*([^;]+)/);
            if (m) return m[1].replace(/\s*!important\s*/g, '').trim();
            return el.getAttribute('width') || null;
          },
          renderHTML: attrs => attrs.width ? {
            style: `width: ${attrs.width} !important; max-width: ${attrs.width} !important;`
          } : {},
        },
      };
    },
  });
  _coreModules = { core, StarterKit, Underline, Highlight, Table, TableRow, TableHeader, TableCell, TextAlign, Image: ResizableImage };
  return _coreModules;
}

// 🖼 設定/縮放圖片寬度(只對目前選取的圖片生效)
function imgWidth(w){
  if (!_editor || !canEditCurrent()) return;
  const sel = _editor.state.selection;
  if (!sel) return;
  const node = _editor.state.doc.nodeAt(sel.from);
  if (node && node.type.name === 'image') {
    _editor.chain().updateAttributes('image', { width: w }).setNodeSelection(sel.from).focus().run();
  } else {
    showToast('請先點圖片再按尺寸');
  }
}
function imgStep(delta){
  if (!_editor || !canEditCurrent()) return;
  const sel = _editor.state.selection;
  if (!sel) return;
  const node = _editor.state.doc.nodeAt(sel.from);
  if (!node || node.type.name !== 'image') { showToast('請先點圖片再按 +/−'); return; }
  const cur = node.attrs.width || '60%';
  const m = String(cur).match(/^(\d+)(%|px)?$/);
  let n = m ? parseInt(m[1]) : 60;
  const unit = m && m[2] ? m[2] : '%';
  n = Math.max(10, Math.min(100, n + delta));
  _editor.chain().updateAttributes('image', { width: n + unit }).setNodeSelection(sel.from).focus().run();
}

// 🖼 圖片上傳(v322:固定走 dental-mnemonics-shared,不讀使用者 settings 的 repo)
//    這樣 HUA 跟 Shirley 兩個人圖片放同一個地方,兩人都看得到。
//    使用者設定的 github_repo 只給筆記本貼圖用。
// v336:圖片上傳目標改回讀使用者 settings 的 repo,每個人傳到自己有寫入權的 repo
//       兩邊圖片放不同 repo,但 raw.github URL 是公開的,互看沒問題
//       (HUA → Victor19940313/2nd-dental-exam · Shirley → Victor19940313/dental-mnemonics-shared)
const IMAGE_DIR_NEW = 'mnemonics-images';

async function uploadImageToGithub(blob) {
  const token = getGithubToken();
  if (!token) throw new Error('沒設定 GitHub token');
  const repo = getGithubRepo(); // 讀使用者設定,沒設 / 格式錯會 fallback 到 REPO_DEFAULT
  // base64
  const b64 = await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = () => reject(new Error('讀檔失敗'));
    r.readAsDataURL(blob);
  });
  const ts = new Date();
  const stamp = ts.getFullYear() + String(ts.getMonth()+1).padStart(2,'0') + String(ts.getDate()).padStart(2,'0')
    + '-' + String(ts.getHours()).padStart(2,'0') + String(ts.getMinutes()).padStart(2,'0') + String(ts.getSeconds()).padStart(2,'0');
  const rand = Math.random().toString(36).slice(2,6);
  const ext = ((blob.type || 'image/png').split('/')[1] || 'png').replace('jpeg','jpg');
  const path = `${IMAGE_DIR_NEW}/${stamp}-${rand}.${ext}`;
  const apiUrl = `https://api.github.com/repos/${repo}/contents/${path}`;
  const res = await fetch(apiUrl, {
    method: 'PUT',
    headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: `upload mnemonics image (${CUR_USER.name})`, content: b64 })
  });
  if (!res.ok) {
    const errTxt = await res.text();
    if (res.status === 403 && /not accessible/i.test(errTxt)) {
      throw new Error(`你的 token 沒有「${repo}」的寫入權。去「考試 App → ⚙️ 設定 → GitHub」確認 repo 跟 token 是配對的`);
    }
    if (res.status === 404) {
      throw new Error(`repo「${repo}」找不到。設定頁裡的 repo 名稱拼錯,或 token 沒給該 repo 的 Contents 權限`);
    }
    throw new Error('GitHub ' + res.status + ': ' + errTxt.slice(0, 200));
  }
  // raw.github 用來顯示(任何人讀,不需 token)
  return `https://raw.githubusercontent.com/${repo}/main/${path}`;
}

async function tryUploadAndInsert(blob) {
  if (!canEditCurrent()) { showToast('你沒有編輯權限'); return; }
  if (!_editor) return;
  // v322:沒 token 早期擋下,顯示具體解法
  if (!getGithubToken()) {
    showToast('🔒 還沒設 GitHub token,圖片功能停用。文字共筆照常用');
    alert('要貼圖必須設 GitHub token:\n\n1. 去 https://github.com/settings/personal-access-tokens/new 生 token\n   - Repository access:選 Victor19940313/dental-mnemonics-shared\n   - Permissions:Contents → Read and write\n2. 複製 token,回到考試 App → ⚙️ 設定 → GitHub 貼上\n3. repo 填 Victor19940313/dental-mnemonics-shared\n\n(只想打字不貼圖的話,直接按取消就好)');
    return;
  }
  showToast('📷 上傳中…(大圖會慢一點)');
  try {
    const url = await uploadImageToGithub(blob);
    _editor.chain().focus().setImage({ src: url }).run();
    showToast('✓ 圖已上傳');
  } catch(e) {
    showToast('❌ 上傳失敗: ' + (e.message || '').slice(0, 80));
  }
}

// 📷 工具列觸發檔案選擇
function pickImageFile() {
  if (!canEditCurrent()) return;
  // 沒 token 就直接走 tryUploadAndInsert 的 alert 路徑,讓使用者知道為什麼不能貼
  if (!getGithubToken()) {
    tryUploadAndInsert(null);
    return;
  }
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.onchange = (e) => {
    const f = e.target.files[0];
    if (f) tryUploadAndInsert(f);
  };
  inp.click();
}

async function initEditorOnce() {
  if (_editor) return;
  const mods = await loadTipTapModules();
  const body = document.getElementById('editor-body');
  body.innerHTML = '';
  _editor = new mods.core.Editor({
    element: body,
    extensions: [
      mods.StarterKit,
      mods.Underline,
      mods.Highlight,
      mods.Table.configure({ resizable: true }),
      mods.TableRow, mods.TableHeader, mods.TableCell,
      mods.TextAlign.configure({ types: ['heading', 'paragraph'] }),
      mods.Image.configure({ inline: true, allowBase64: false }),
    ],
    content: '<p></p>',
    editable: false, // 預設閱覽模式,按「✏ 編輯」才轉成 true
    editorProps: {
      handlePaste(view, event) {
        if (!canEditCurrent()) return false;
        const cd = event.clipboardData;
        if (!cd) return false;
        for (const item of cd.items || []) {
          if (item.type && item.type.startsWith('image/')) {
            event.preventDefault();
            const blob = item.getAsFile();
            if (blob) tryUploadAndInsert(blob);
            return true;
          }
        }
        return false;
      },
      handleDrop(view, event) {
        if (!canEditCurrent()) return false;
        const files = event.dataTransfer && event.dataTransfer.files;
        if (!files || !files.length) return false;
        for (const file of files) {
          if (file.type && file.type.startsWith('image/')) {
            event.preventDefault();
            tryUploadAndInsert(file);
            return true;
          }
        }
        return false;
      }
    },
    onUpdate: () => {
      _dirty = true;
      refreshStatusUI();
    },
    onSelectionUpdate: ({ editor }) => {
      // 🖼 選到圖片才顯示圖片工具列
      const tbar = document.getElementById('img-toolbar');
      if (!tbar) return;
      const sel = editor.state.selection;
      const node = sel ? editor.state.doc.nodeAt(sel.from) : null;
      const isImg = node && node.type.name === 'image' && _editMode && canEditCurrent();
      tbar.classList.toggle('visible', !!isImg);
      const statusEl = tbar.querySelector('.img-status');
      if (statusEl && isImg) {
        const w = node.attrs.width || '預設';
        statusEl.textContent = '目前寬度:' + w;
      }
    }
  });
}

init();

// 🛡 v308:SW 通知有新版時提示使用者
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', (event) => {
    if (event.data && event.data.type === 'NEW_VERSION_READY') {
      const t = document.createElement('div');
      t.className = 'toast';
      t.style.cssText = 'background:#7c3aed;cursor:pointer;padding:.7rem 1.2rem';
      t.innerHTML = '✨ 新版本已就緒,點這裡刷新';
      t.onclick = () => location.reload();
      document.body.appendChild(t);
      // 不自動消失,等使用者點
    }
  });
  navigator.serviceWorker.register('./sw.js').then(reg => {
    setInterval(() => reg.update(), 60000); // 每分鐘檢查新版
  }).catch(()=>{});
}

<!-- v390:從重看試卷右上「🧠 口訣區」跳過來時,秀一個浮動「🔙 回試卷·第N題」按鈕(樣式仿偷看筆記返回鈕) -->
<script>
(function(){
  let raw = null;
  try { raw = sessionStorage.getItem('_examReviewMnemReturn'); } catch(e){ return; }
  if (!raw) return;
  let data; try { data = JSON.parse(raw); } catch(e){ return; }
  if (!data || !data.entry) return;
  const idx = (data.idx || 0) + 1;
  function mount(){
    if (document.getElementById('mnem-review-return-btn')) return;
    const btn = document.createElement('button');
    btn.id = 'mnem-review-return-btn';
    btn.textContent = `🔙 回試卷 · 第 ${idx} 題`;
    btn.style.cssText = 'position:fixed !important;top:12px !important;right:12px !important;z-index:99999 !important;background:linear-gradient(135deg,#7c3aed,#a855f7);color:white;border:none;padding:.6rem 1.05rem;border-radius:22px;box-shadow:0 4px 14px rgba(124,58,237,.45);font-size:.85rem;font-weight:700;cursor:pointer;display:block !important';
    btn.onclick = function(){
      try {
        sessionStorage.setItem('_examReviewReopenSignal', raw);
        sessionStorage.removeItem('_examReviewMnemReturn');
      } catch(e){}
      location.href = 'exam/index.html';
    };
    document.body.appendChild(btn);
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    mount();
  } else {
    document.addEventListener('DOMContentLoaded', mount);
  }
})();
</script>
